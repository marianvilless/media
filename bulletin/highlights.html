<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Highlights - Bulletin Board</title>
    <style>
        :root {
            --board-bg: #8d6e63;
            --board-texture: #795548;
            --note-yellow: #fff59d;
            --note-blue: #81d4fa;
            --note-green: #a5d6a7;
            --note-pink: #f48fb1;
            --text-color: #333;
            --pin-color: #d32f2f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .bulletin-board {
            background: var(--board-bg);
            background-image: 
                radial-gradient(circle at 2px 2px, var(--board-texture) 1px, transparent 0);
            background-size: 4px 4px;
            width: 100%;
            max-width: 1200px;
            border: 15px solid #5d4037;
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 100px rgba(0,0,0,0.2);
            padding: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
            position: relative;
            min-height: 80vh;
        }

        .board-header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-size: clamp(1.2rem, 3vw, 2rem);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            border-bottom: 2px dashed rgba(255,255,255,0.3);
            padding-bottom: 15px;
        }

        .back-button {
            text-decoration: none;
            color: white;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: background 0.3s;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .back-button:hover {
            background: rgba(0, 0, 0, 0.4);
        }

        /* Polaroid / Photo Card Style */
        .highlight-item {
            background: #fff;
            padding: 15px 15px 40px 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: relative;
            transform: rotate(var(--rotation));
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: pin-swing 1s ease-out backwards;
        }

        .highlight-item::before {
            content: "";
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 14px;
            background: var(--pin-color);
            border-radius: 50%;
            box-shadow: 1px 2px 3px rgba(0,0,0,0.4);
            z-index: 10;
        }

        .highlight-item img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border: 1px solid #ddd;
            margin-bottom: 15px;
        }

        .highlight-item .caption {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 1.1rem;
            color: #444;
            line-height: 1.2;
            text-align: center;
        }

        .highlight-item:hover {
            transform: scale(1.1) rotate(0deg);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            z-index: 30;
        }

        /* Animations and Delays */
        @keyframes pin-swing {
            0% { transform: translateY(-100px) rotate(30deg); opacity: 0; }
            100% { transform: translateY(0) rotate(var(--rotation)); opacity: 1; }
        }

        .item-1 { --rotation: -2deg; animation-delay: 0.1s; }
        .item-2 { --rotation: 3deg; animation-delay: 0.2s; }
        .item-3 { --rotation: -4deg; animation-delay: 0.3s; }
        .item-4 { --rotation: 2.5deg; animation-delay: 0.4s; }

    </style>
</head>
<body>

    <div class="bulletin-board">
        <header class="board-header">
            <a href="index.html" class="back-button">← BACK TO BOARD</a>
            <span>Semester Highlights</span>
            <div style="width: 120px"></div> <!-- Spacer -->
        </header>

        <div class="highlight-item item-1">
            <img src="https://images.unsplash.com/photo-1564325724739-bae0bd08762c?auto=format&fit=crop&q=80&w=400" alt="Science Project">
            <p class="caption">Grand Prize: Robot Challenge</p>
        </div>

        <div class="highlight-item item-2">
            <img src="https://images.unsplash.com/photo-1517466787929-bc90951d0974?auto=format&fit=crop&q=80&w=400" alt="Football Victory">
            <p class="caption">Varsity Tigers Win Finals!</p>
        </div>

        <div class="highlight-item item-3">
            <img src="https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?auto=format&fit=crop&q=80&w=400" alt="Art Mural">
            <p class="caption">Community Mural Complete</p>
        </div>

        <div class="highlight-item item-4">
            <img src="https://images.unsplash.com/photo-1507676184212-d03ab07a01bf?auto=format&fit=crop&q=80&w=400" alt="Stage Play">
            <p class="caption">Opening Night: Shakespeare</p>
        </div>

    </div>

</body>
</html>
